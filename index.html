<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commande vêtements club VTT 2027</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e2e5e9;--ac:#d9461c;--on:#fff;--ok:#1a7f4b;--wa:#b54708;--sel:#fff3ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mu:#9aa4ae;--bd:#2f363c;--ac:#ff7a50;--on:#1b1f24;--ok:#4cc38a;--wa:#f5b04c;--sel:#2b2420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mu:#9aa4ae;--bd:#2f363c;--ac:#ff7a50;--on:#1b1f24;--ok:#4cc38a;--wa:#f5b04c;--sel:#2b2420;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:22px 0 8px}
.mu{color:var(--mu);font-size:13px}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
select,input{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 label{margin:0}
.art{display:grid;grid-template-columns:1fr auto 80px;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--bd);border-radius:8px}
.art:last-child{border-bottom:0}.art.sel{background:var(--sel)}
.ai b{display:block}.ai span{display:block}.ai select{width:auto;margin:6px 0 0;padding:5px 8px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.step output{min-width:22px;text-align:center;font-weight:700}
.lt{text-align:right;font-weight:600}
.bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.bar b{font-size:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.pri,button.sec{padding:10px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--ac)}
button.pri{background:var(--ac);color:var(--on)}button.sec{background:transparent;color:var(--ac)}
.note{margin:10px 2px;font-size:13px}.note.ok{color:var(--ok)}.note.wa{color:var(--wa)}
textarea{width:100%;margin-top:8px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:22px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--bd)}
td.z{color:var(--mu)}
details{margin-top:10px;font-size:13px}
@media (max-width:480px){.art{grid-template-columns:1fr auto}.lt{grid-column:1/-1;text-align:right;margin-top:-6px}}
</style></head>
<body><main>
<h1>Commande vêtements club VTT 2027</h1>
<div class="mu">Choisissez votre nom, vos tailles et les quantités : le total se calcule tout seul.</div>
<div id="st" class="note mu">Connexion…</div>
<nav class="tabs"><button data-t="f" class="on">Ma commande</button><button data-t="s">Synthèse du club</button></nav>

<section id="f">
 <div class="card">
  <label>Adhérent<select id="who"></select></label>
  <label id="nl" hidden>Nom et prénom<input id="nm" placeholder="NOM Prénom" autocomplete="name"></label>
  <div class="row2"><label>Taille haut suggérée<select id="th"></select></label><label>Taille bas suggérée<select id="tb"></select></label></div>
  <div class="mu" style="margin-top:8px">Ces tailles servent de suggestion. Vous pouvez les changer pour chaque article ci-dessous.</div>
 </div>
 <div class="card" id="arts"></div>
 <div class="bar"><div><span class="mu">Total</span> <b id="tot"></b> <span id="cnt" class="mu"></span></div>
  <div class="btns"><button id="ml" class="sec">Envoyer par e-mail</button><button id="cp" class="sec">Copier le récap</button><button id="sv" class="pri">Enregistrer</button></div></div>
 <div id="msg" class="note" aria-live="polite"></div>
 <textarea id="rc" readonly hidden rows="9"></textarea>
</section>

<section id="s" hidden><div id="sy"></div><div id="adm"></div><div id="imp"><h2>Importer des commandes reçues par message</h2><div class="card"><textarea id="ip" rows="5" placeholder="Collez ici les messages reçus (chacun contient un code GOBIK1:…)"></textarea><p><button id="ib" class="pri">Ajouter ces commandes</button> <span id="im" class="mu"></span></p></div></div></section>
<footer class="mu" style="text-align:center;padding:12px"><button id="adminLink" class="sec" style="font-size:12px;padding:5px 9px">Organisateur</button></footer>
</main>
<script>
const ART=[
{id:"mc",n:"Maillot manche courte",s:"Maillot MC",r:"CX RF Unisex",p:57.82,g:"h"},
{id:"ml",n:"Maillot manche longue",s:"Maillot ML",r:"CX PRO 3.0 Unisex",p:67.64,g:"h"},
{id:"cc",n:"Cuissard court",s:"Cuissard court",r:"MATT 2.0 Homme – K12",p:102.55,g:"b"},
{id:"cl",n:"Cuissard long",s:"Cuissard long",r:"Absolute Solid Homme – K12",p:121.09,g:"b"},
{id:"ma",n:"Manchettes",s:"Manchettes",r:"Natsu été",p:26.18,g:"h"},
{id:"sv",n:"Short VTT",s:"Short VTT",r:"Ranger Unisex",p:74.18,g:"b"},
{id:"cv",n:"Coupe-vent",s:"Coupe-vent",r:"Windpeak Unisex",p:66.54,g:"h"},
{id:"cm",n:"Coupe-vent manche courte",s:"Coupe-vent MC",r:"Basic Unisex",p:46.91,g:"h"},
{id:"vh",n:"Veste hiver",s:"Veste hiver",r:"Skimo Pro Homme",p:134.18,g:"h"},
{id:"sz",n:"Sweat zippé",s:"Sweat zippé",r:"Réf. à préciser",p:null,g:"h"},
{id:"sn",n:"Sweat non zippé",s:"Sweat non zippé",r:"Réf. à préciser",p:null,g:"h"},
{id:"sf",n:"Veste softshell Las du Biclou",s:"Softshell",r:"Réf. à préciser",p:null,g:"h"}];
const SZ=["XS","S","M","L","XL","2XL","3XL","4XL"];
const MEM=[["BARBAULT Herve","L","L"],["BLAIRE Louis","XL","XL"],["BOITTIN Pascal","XL",""],["BOURGEOIS ELVIS","L","L"],["BUREL Jean Marc","XL","M"],["CHEDEVILLE Franck","","M"],["CHRETIEN Philippe","L","M"],["COLAS Michel","3XL","3XL"],["DABET Axel","",""],["DAUNAY Vincent","4XL","4XL"],["DAVID WILLY","","M"],["DELALANDE Frederic","",""],["DELISLE BRUNO","",""],["FIZELIER GUILLAUME","M","S"],["FONTAINE Serge","","XL"],["HENRI Pierre Antoine","M",""],["HEUVELINE Romain","S","S"],["HOCDE Mikael","XL","XL"],["JACOPIN Stephane","",""],["JOUANNE Anthony","S","S"],["JOURDAN Jean Paul","2XL","2XL"],["JOURDAN Sebastien","",""],["LAIGLE Sylvain","L","M"],["LAMBERT Frederic","M","M"],["LE GALL Julien","L","M"],["LE TALLEC Gilles","2XL","XL"],["LEDUC Romuald","",""],["LEGAVRE BENOIT","XL","XL"],["LEMARCHAND Regis","M","M"],["LERESTE Jerome","2XL","L"],["LUCAS Yannick","2XL","2XL"],["MARTIN Roland","",""],["MICHEL Julien","",""],["PICHONNET Lionel","2XL","XL"],["PROVOST Gildas","L","L"],["RENAULT Jean Claude","2XL","XL"],["ROBE Emmanuel","L","L"],["ROLLAND Denis","XL","XL"],["ROUILLEE Joseph-Michel","2XL","2XL"],["VALLERIE Mickael","2XL","2XL"],["VALLIER FRANCK","L","L"],["VAN SCHORISSE Jean Michel","2XL",""],["VANNIER Loic","L","L"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let cfg={};
const pr=a=>{const c=cfg[a.id];return c&&typeof c.p==="number"?c.p:a.p};
const rf=a=>(cfg[a.id]&&cfg[a.id].r)||a.r;
const total=q=>ART.reduce((s,a)=>s+((q||{})[a.id]||0)*(pr(a)||0),0);
const unp=q=>ART.filter(a=>(q||{})[a.id]&&pr(a)==null);
const ep=a=>pr(a)==null?"tarif à venir":eur(pr(a));
const szOf=(a,o)=>(o.sz&&o.sz[a.id])||(a.g==="h"?o.th:o.tb)||"";
const count=q=>ART.reduce((s,a)=>s+((q||{})[a.id]||0),0);
let orders={},cur={name:"",th:"",tb:"",q:{}};

function msg(t,c){const m=$("#msg");m.textContent=t;m.className="note "+(c||"")}
function stat(){
 const s=$("#st");
 s.textContent=API
  ?"● Site connecté à Google Sheets : les commandes sont partagées."
  :"Connexion Google Sheets non configurée.";
 s.className="note "+(API?"ok":"wa");
}

const sizeOf=a=>szOf(a,cur);
const selOpts=v=>`<option value="">Taille…</option>`+SZ.map(z=>`<option${z===v?" selected":""}>${z}</option>`).join("");
function renderArts(){
 $("#arts").innerHTML=ART.map(a=>{const n=cur.q[a.id]||0;return `<div class="art${n?" sel":""}"><div class="ai"><b>${a.n}</b><span class="mu">${esc(rf(a))} · ${ep(a)}</span><select data-sz="${a.id}" aria-label="Taille ${esc(a.n)}">${selOpts(sizeOf(a))}</select></div><div class="step"><button data-id="${a.id}" data-d="-1" aria-label="Moins">−</button><output>${n}</output><button data-id="${a.id}" data-d="1" aria-label="Plus">+</button></div><div class="lt">${n?(pr(a)==null?"—":eur(n*pr(a))):""}</div></div>`}).join("");
 const c=count(cur.q);$("#tot").textContent=eur(total(cur.q));const u=unp(cur.q).length;$("#cnt").textContent=`(${c} article${c>1?"s":""})`+(u?` · ${u} sans tarif`:"");
}
function setWho(name,th,tb){
 cur.name=name;const o=orders[slug(name)];
 if(o){cur.th=o.th||"";cur.tb=o.tb||"";cur.q=Object.assign({},o.q);cur.sz=Object.assign({},o.sz)}else{cur.th=th||"";cur.tb=tb||"";cur.q={};cur.sz={}}
 $("#th").value=cur.th;$("#tb").value=cur.tb;renderArts();
}
function pick(v){
 $("#nl").hidden=v!=="__new";
 try{localStorage.setItem("gobik-who",v)}catch(e){}
 if(v===""||v==="__new"){cur={name:"",th:"",tb:"",q:{}};$("#th").value="";$("#tb").value="";$("#nm").value="";renderArts();return}
 setWho(...MEM[+v]);
}
function recap(){
 const L=ART.filter(a=>cur.q[a.id]).map(a=>`- ${cur.q[a.id]} × ${a.n}, taille ${sizeOf(a)||"?"} (${ep(a)})`);
 return `Commande Gobik 2027 — ${cur.name}\n${L.join("\n")||"- (aucun article)"}\nTotal : ${eur(total(cur.q))}\n\nCode à conserver tel quel : ${mkCode()}`;
}
async function save(){
 if(!cur.name.trim()){msg("Indiquez votre nom.","wa");return}
 if(ART.some(a=>cur.q[a.id]&&!sizeOf(a))){msg("Choisissez une taille pour chaque article sélectionné.","wa");return}
 const q={};ART.forEach(a=>{if(cur.q[a.id])q[a.id]=cur.q[a.id]});
 const z={};ART.forEach(a=>{if(q[a.id])z[a.id]=sizeOf(a)});
 const o={name:cur.name.trim(),q:q,sz:z};
 try{
  if(!API)throw new Error("API Google Sheets non configurée.");
  const j=await postAPI({action:"order",n:o.name,q:q,z:z});
  if(!j.ok)throw new Error(j.error||"refusé");
  orders[slug(o.name)]={name:o.name,th:"",tb:"",q:q,sz:z};
  renderSyn();
  msg("Commande enregistrée ✓ Pour la modifier, utilisez le même nom et enregistrez à nouveau.","ok");
 }catch(e){
  msg("Échec de l’enregistrement : "+((e&&e.message)||"réessayez")+". Utilisez « Copier le récap ».","wa");
 }
}

const ORG="";
const API="https://script.google.com/macros/s/AKfycbzbFws1HvTSLJuXgSrlc8eZXINXP0D5VSeeV5TLgNhCcYJguD7Eo079mBG0Vsy4a8_j/exec";
let adminKey="";
let isAdmin=false;

async function postAPI(data){
 const r=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"text/plain;charset=utf-8"},
  body:JSON.stringify(data)
 });
 return await r.json();
}

async function loadRemote(){
 if(!API)return;
 try{
  const r=await fetch(API);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Erreur de lecture");
  orders={};
  (j.orders||[]).forEach(o=>{
   orders[slug(o.n)]={
    name:o.n,th:"",tb:"",q:o.q||{},sz:o.z||{}
   };
  });
  cfg=j.config||{};
  renderArts();
  renderSyn();
  renderAdm();
  stat();
 }catch(e){
  console.error(e);
  $("#st").textContent="Erreur de connexion à Google Sheets : "+(e.message||"réessayez");
  $("#st").className="note wa";
 }
}
function mkCode(){const q={},z={};ART.forEach(a=>{if(cur.q[a.id]){q[a.id]=cur.q[a.id];z[a.id]=sizeOf(a)}});return "GOBIK1:"+btoa(unescape(encodeURIComponent(JSON.stringify({n:cur.name.trim(),q,z}))))}
async function mail(){
 if(!cur.name.trim()){msg("Indiquez votre nom.","wa");return}
 location.href="mailto:"+ORG+"?subject="+encodeURIComponent("Commande vêtements club VTT 2027 — "+cur.name.trim())+"&body="+encodeURIComponent(recap());
}
async function copy(){
 if(!cur.name.trim()){msg("Indiquez votre nom.","wa");return}
 const t=recap(),r=$("#rc");r.hidden=false;r.value=t;r.select();
 try{await navigator.clipboard.writeText(t);msg("Récap copié ✓","ok")}catch(e){msg("Sélectionnez le texte ci-dessous pour le copier.","wa")}
}

function list(){return Object.entries(orders).map(([k,o])=>Object.assign({k,q:{}},o)).sort((a,b)=>a.name.localeCompare(b.name,"fr"))}
function csv(){
 const L=list().filter(o=>count(o.q)>0),rows=[["Nom",...ART.map(a=>a.s),"Total €"]];
 L.forEach(o=>rows.push([o.name,...ART.map(a=>o.q[a.id]?o.q[a.id]+" ("+(szOf(a,o)||"?")+")":""),total(o.q).toFixed(2).replace(".",",")]));
 rows.push(["TOTAL",...ART.map(a=>L.reduce((s,o)=>s+(o.q[a.id]||0),0)),L.reduce((s,o)=>s+total(o.q),0).toFixed(2).replace(".",",")]);
 return "\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
}
function renderSyn(){
 const all=list(),L=all.filter(o=>count(o.q)>0);
 const nb=L.reduce((s,o)=>s+count(o.q),0),tot=L.reduce((s,o)=>s+total(o.q),0);
 const unk=ART.some(a=>L.some(o=>o.q[a.id]&&!szOf(a,o)));
 const cols=SZ.concat(unk?["?"]:[]);
 const sz=(a,o)=>szOf(a,o)||"?";
 const rows=ART.map(a=>{
  const qty=L.reduce((s,o)=>s+(o.q[a.id]||0),0);
  const cells=cols.map(c=>{const n=L.reduce((s,o)=>s+(sz(a,o)===c?(o.q[a.id]||0):0),0);return `<td class="n${n?"":" z"}">${n||"·"}</td>`}).join("");
  return `<tr><td>${a.n}</td><td class="n">${qty}</td><td class="n">${pr(a)==null?"—":eur(qty*pr(a))}</td>${cells}</tr>`}).join("");
 const done=new Set(all.map(o=>o.k)),miss=MEM.filter(m=>!done.has(slug(m[0])));
 $("#sy").innerHTML=`
 <div class="kpi"><div><b>${L.length}</b><span class="mu">adhérents commandeurs</span></div><div><b>${nb}</b><span class="mu">articles</span></div><div><b>${eur(tot)}</b><span class="mu">total commande</span></div></div>
 <h2>Par article et par taille</h2>${ART.some(a=>pr(a)==null&&L.some(o=>o.q[a.id]))?'<div class="note wa">Certains articles n’ont pas encore de tarif : ils ne sont pas inclus dans le total.</div>':""}
 <div class="sc"><table><thead><tr><th>Article</th><th class="n">Qté</th><th class="n">Montant</th>${cols.map(c=>`<th class="n">${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody>
 <tfoot><tr><td>Total</td><td class="n">${nb}</td><td class="n">${eur(tot)}</td><td colspan="${cols.length}"></td></tr></tfoot></table></div>
 ${unk?'<div class="note wa">« ? » : taille manquante pour certains articles.</div>':""}
 <h2>Détail par adhérent</h2>
 <div class="sc"><table><thead><tr><th>Adhérent</th><th>Articles (taille)</th><th class="n">Total</th></tr></thead><tbody>${
  L.map(o=>`<tr><td>${esc(o.name)}</td><td>${ART.filter(a=>o.q[a.id]).map(a=>`${esc(o.q[a.id])}× ${a.s} (${esc(szOf(a,o)||"?")})`).join(", ")}</td><td class="n">${eur(total(o.q))}</td></tr>`).join("")||'<tr><td colspan="3" class="z">Aucune commande pour le moment.</td></tr>'}</tbody></table></div>
 <details><summary>Sans réponse (${miss.length})</summary><div class="mu">${miss.map(m=>esc(m[0])).join(", ")||"Tout le monde a répondu."}</div></details>
 ${API?'<p><button id="ex" class="pri">Exporter en CSV (Excel)</button></p>':""}`;
}

function renderAdm(){
 const el=$("#adm");
 if(!isAdmin){el.innerHTML="";$("#imp").hidden=true;return}
 $("#imp").hidden=false;
 el.innerHTML=`<h2>Administration — tarifs et références</h2>
 <div class="card">
 ${ART.map(a=>`<div class="row2" style="margin-bottom:8px">
 <label>${esc(a.n)}<input data-r="${a.id}" value="${esc(rf(a))}"></label>
 <label>Tarif (€)<input data-p="${a.id}" inputmode="decimal" placeholder="à venir" value="${pr(a)==null?"":pr(a)}"></label>
 </div>`).join("")}
 <button id="sp" class="pri">Enregistrer les tarifs</button>
 <button id="logout" class="sec">Fermer la session organisateur</button>
 <span id="pm" class="mu"></span></div>`;
 $("#sp").onclick=async()=>{
  const c={};
  ART.forEach(a=>{
   const r=el.querySelector(`[data-r="${a.id}"]`).value.trim();
   const v=el.querySelector(`[data-p="${a.id}"]`).value.replace(",",".").trim();
   const p=v===""?null:Number(v);
   c[a.id]={r,p:Number.isFinite(p)?p:null};
  });
  try{
   const j=await postAPI({action:"saveConfig",adminKey:adminKey,config:c});
   if(!j.ok)throw new Error(j.error||"Refusé");
   cfg=c;renderArts();renderSyn();
   $("#pm").textContent="Tarifs et références enregistrés ✓";
  }catch(e){$("#pm").textContent="Échec : "+(e.message||"réessayez")}
 };
 $("#logout").onclick=()=>{
  adminKey="";isAdmin=false;renderAdm();
 };
}
(function init(){
 $("#who").innerHTML='<option value="">— Choisir mon nom —</option>'+MEM.map((m,i)=>`<option value="${i}">${esc(m[0])}</option>`).join("")+'<option value="__new">Je ne suis pas dans la liste</option>';
 [["#th","Haut"],["#tb","Bas"]].forEach(([s,p])=>$(s).innerHTML=`<option value="">${p}…</option>`+SZ.map(z=>`<option>${z}</option>`).join(""));
 $("#who").onchange=e=>pick(e.target.value);
 $("#nm").oninput=e=>{cur.name=e.target.value};
 $("#th").onchange=e=>{cur.th=e.target.value;renderArts()};
 $("#tb").onchange=e=>{cur.tb=e.target.value;renderArts()};
 $("#arts").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=b.dataset.id,n=Math.max(0,Math.min(20,(cur.q[id]||0)+ +b.dataset.d));
  if(n)cur.q[id]=n;else delete cur.q[id];
  renderArts();
 };
 $("#arts").onchange=e=>{
  const sel=e.target.closest("select[data-sz]");if(!sel)return;
  cur.sz=cur.sz||{};cur.sz[sel.dataset.sz]=sel.value;renderArts();
 };
 $("#sv").onclick=save;$("#cp").onclick=copy;$("#ml").onclick=mail;
 $("#imp").hidden=true;
 $("#ib").onclick=async()=>{
  const t=$("#ip").value,re=/GOBIK1:([A-Za-z0-9+\/=]+)/g;
  let m,n=0,bad=0,ordersToImport=[];
  while((m=re.exec(t))){
   try{
    const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
